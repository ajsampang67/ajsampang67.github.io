              value: wordpress
          image: mysql:5.7
          name: database
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: database-data
      restartPolicy: Always
      volumes:
        - hostPath:
            path: /home/ajsampang
          name: database-data
