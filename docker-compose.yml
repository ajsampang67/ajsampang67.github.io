version: '3.3'

services:
  ajtheamazing:
    container_name: ajtheamazing
    image: ajsampang67/ajtheamazing:latest 
    restart: always
    ports:
      - 8080:8080
    networks:
      - ajsampangdotcom

  wigi:
    container_name: wigi
    image: ajsampang67/wigi:latest
    ports:
      - 5000:5000
    restart: always
    networks:
      - ajsampangdotcom
    volumes:
      - "/build/web:/var/www/app/public:ro"

networks:
  ajsampangdotcom:
    driver: bridge