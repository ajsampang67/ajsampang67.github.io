version: '3.3'

services:
  ajtheamazing:
    depends_on:
      - database
    image: ajtheamazing
    volumes:
      - ajtheamazing_files:/home/ajsampang/ajtheamazing
    restart: always
    ports:
      - "8080:8080"

  blog:
    depends_on:
      - database
    image: wordpress:latest
    volumes:
      - wordpress_files:/var/www/html
    ports:
      - "8081:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ajMysql67

  database:
    image: mysql:5.7
    volumes:
      - database_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ajMysql67
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ajMysql67 

  webserver:
    image: nginx
    volumes:
      - ./webserver/templates:/etc/nginx/templates
    ports:
      - "80:80"
    environment:
      - NGINX_PORT=80

volumes:
  ajtheamazing_files:
  wordpress_files:
  database_data:


